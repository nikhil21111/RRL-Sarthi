<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#DD4A4A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RRL Saarthi - Bus Pass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <button class="close-btn" onclick="closeApp()">✕</button>
        <a href="#" class="all-passes-link">All passes</a>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="pass-card">
            <!-- Header Section -->
            <div class="pass-header">
                <h1>Rajkot Rajpath Ltd</h1>
            </div>

            <!-- ID and Fare Section -->
            <div class="pass-content">
                <div class="id-fare-section">
                    <div class="labels-row">
                        <span class="label-id">ID</span>
                        <span class="label-fare">Fare</span>
                    </div>
                    <div class="values-row">
                        <input 
                            type="text" 
                            id="userName" 
                            class="name-input" 
                            value="NIKHIL VEKARIYA"
                            maxlength="30"
                        />
                        <span class="fare-value">₹25</span>
                    </div>
                </div>

                <!-- Dashed Separator with Circular Cutouts -->
                <div class="separator"></div>

                <!-- Booking and Validity Time Section -->
                <div class="time-section">
                    <div class="field-group">
                        <label>Booking Time</label>
                        <input 
                            type="datetime-local" 
                            id="bookingTime" 
                            class="time-input"
                        />
                        <div id="bookingTimeDisplay" class="value"></div>
                    </div>
                    <div class="field-group">
                        <label>Validity Time</label>
                        <div id="validityTime" class="value"></div>
                    </div>
                </div>

                <!-- Pass Number -->
                <div class="pass-number" id="passNumber"></div>
            </div>

            <!-- Footer Section -->
            <div class="pass-footer">
                <h2>One Day Pass</h2> 
            </div>

            <!-- Logo Section -->
            <div class="logo-section">
                <img src="images/logo.png" alt="RRL Saarthi Logo" class="logo" id="logo">
            </div>

            <!-- Expiry Countdown -->
            <div class="expiry-timer" id="expiryTimer">
                Expires in 00:00:00
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
